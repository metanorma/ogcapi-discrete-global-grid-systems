name: docker

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 11 # Adds 11GB of virtual memory

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          working-directory: .
          bundler-cache: true

      - name: Print Metanorma version
        run: bundle exec metanorma --version

      - name: Cache or generate Metanorma XML
        uses: actions-mn/build-and-publish@v2
        timeout-minutes: 150
        env:
          JAVA_OPTS: "-Xmx5g"
        with:
          use-bundler: true
          agree-to-terms: true
          strict: false
          destination: artifact
          artifact-name: mn
          cache-site-for-manifest: metanorma.yml
          cache-extra-input: |
            sources/xmi/**
            sources/liquid_templates/**
            sources/guidance/**

  deploy-pages:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Make dist dir
        run: mkdir dist

      - name: Download the Metanorma site artifact
        uses: actions/download-artifact@v4
        with:
          name: mn
          path: dist

      - name: List files in dist
        run: ls -l dist

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


